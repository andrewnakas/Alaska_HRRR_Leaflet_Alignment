<!DOCTYPE html>
<html>
<head>
    <title>HRRR Alaska - Proper Dateline Handling</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 12px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .info-panel .status {
            color: #27ae60;
            font-weight: bold;
        }
        .info-panel .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>HRRR Alaska</h3>
        <div id="status">Loading...</div>
        <div style="margin-top: 10px; font-size: 11px; color: #666;">
            Full domain with dateline handling<br>
            All data included
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Antimeridian plugin for dateline crossing -->
    <script src="https://unpkg.com/leaflet-antimeridian@1.0.1/src/leaflet-antimeridian.js"></script>

    <script>
        console.log('='.repeat(80));
        console.log('HRRR Alaska - Proper Dateline Handling');
        console.log('='.repeat(80));
        console.log();

        // Create map
        var map = L.map('map', {
            center: [60, -155],
            zoom: 4,
            minZoom: 3,
            maxZoom: 10,
            worldCopyJump: false  // Don't wrap around the world
        });

        // Add OpenStreetMap base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Load HRRR data
        fetch('test-data.json')
            .then(response => response.json())
            .then(data => {
                console.log('Loaded HRRR Alaska data:');
                console.log('  Method:', data._metadata.method);
                console.log('  Variable:', data._metadata.variable);
                console.log('  Grid:', data._metadata.grid_shape.join(' x '));
                console.log();

                // Get bounds from the data
                var bounds = data.direct.bounds;
                var west = bounds[0];
                var south = bounds[1];
                var east = bounds[2];
                var north = bounds[3];

                console.log('Image bounds:');
                console.log('  West:', west.toFixed(2), '°');
                console.log('  South:', south.toFixed(2), '°');
                console.log('  East:', east.toFixed(2), '°');
                console.log('  North:', north.toFixed(2), '°');
                console.log();

                // Add image overlay
                var imageBounds = [
                    [south, west],
                    [north, east]
                ];

                var imageOverlay = L.imageOverlay(
                    data.direct.image_url,
                    imageBounds,
                    {
                        opacity: 0.7,
                        interactive: false
                    }
                ).addTo(map);

                console.log('✓ Image overlay added');
                console.log();

                // Add boundary polygon with antimeridian support
                var boundaryCoords = data.boundary_polygon.map(p => [p.lat, p.lon]);

                // Use geodesic polygon if antimeridian plugin is available
                var boundaryPolygon;
                if (L.Polyline.Antimeridian) {
                    boundaryPolygon = L.polygon.antimeridian(boundaryCoords, {
                        color: 'red',
                        weight: 2,
                        fillOpacity: 0,
                        interactive: false
                    }).addTo(map);
                    console.log('✓ Boundary polygon added (with antimeridian support)');
                } else {
                    boundaryPolygon = L.polygon(boundaryCoords, {
                        color: 'red',
                        weight: 2,
                        fillOpacity: 0,
                        interactive: false
                    }).addTo(map);
                    console.log('✓ Boundary polygon added (standard)');
                }
                console.log('  Points:', boundaryCoords.length);
                console.log();

                // Get actual boundary extent
                var lats = data.boundary_polygon.map(p => p.lat);
                var lons = data.boundary_polygon.map(p => p.lon);
                var boundary_west = Math.min(...lons);
                var boundary_south = Math.min(...lats);
                var boundary_east = Math.max(...lons);
                var boundary_north = Math.max(...lats);

                console.log('Boundary extent:');
                console.log('  West:', boundary_west.toFixed(2), '°');
                console.log('  South:', boundary_south.toFixed(2), '°');
                console.log('  East:', boundary_east.toFixed(2), '°');
                console.log('  North:', boundary_north.toFixed(2), '°');
                console.log();

                // Check for dateline crossing
                var west_lons = lons.filter(lon => lon < 0);
                var east_lons = lons.filter(lon => lon > 0);
                if (west_lons.length > 0 && east_lons.length > 0) {
                    var west_extent = [Math.min(...west_lons), Math.max(...west_lons)];
                    var east_extent = [Math.min(...east_lons), Math.max(...east_lons)];
                    console.log('✓ Dateline crossing detected:');
                    console.log('  Western side:', west_extent[0].toFixed(2), '° to', west_extent[1].toFixed(2), '°');
                    console.log('  Eastern side:', east_extent[0].toFixed(2), '° to', east_extent[1].toFixed(2), '°');
                    console.log('  Gap at dateline:', (180 - east_extent[1] + 180 + west_extent[0]).toFixed(2), '° (wraps around)');
                }
                console.log();

                // Update status
                document.getElementById('status').innerHTML =
                    '<span class="status">✓ Loaded</span><br>' +
                    'Variable: ' + data._metadata.variable + '<br>' +
                    'Date: ' + data._metadata.date.substring(0, 10) + '<br>' +
                    'Grid: ' + data._metadata.grid_shape.join(' × ') + '<br>' +
                    'Dateline: Properly handled';

                // Fit map to image bounds
                map.fitBounds(imageBounds);

                console.log('='.repeat(80));
                console.log('SUCCESS!');
                console.log('Full HRRR Alaska domain with proper dateline handling');
                console.log('='.repeat(80));

            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML =
                    '<span class="error">✗ Error loading data</span><br>' +
                    error.message;
            });
    </script>
</body>
</html>
