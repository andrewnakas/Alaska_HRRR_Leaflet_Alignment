<!DOCTYPE html>
<html>
<head>
    <title>HRRR Alaska - Continuous Bounds</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 12px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .info-panel .status {
            color: #27ae60;
            font-weight: bold;
        }
        .info-panel .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>HRRR Alaska</h3>
        <div id="status">Loading...</div>
        <div style="margin-top: 10px; font-size: 11px; color: #666;">
            Russia → Alaska<br>
            Continuous bounds (no world-wrap)
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        console.log('='.repeat(80));
        console.log('HRRR Alaska - Continuous Bounds (Russia → Alaska)');
        console.log('='.repeat(80));
        console.log();

        // Create map with world copy wrapping
        var map = L.map('map', {
            center: [60, -155],
            zoom: 4,
            minZoom: 2,
            maxZoom: 10,
            worldCopyJump: true,  // Enable wrapping
            maxBounds: null  // Allow panning across dateline
        });

        // Add OpenStreetMap base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19,
            noWrap: false  // Allow tile wrapping
        }).addTo(map);

        // Load HRRR data
        fetch('test-data.json')
            .then(response => response.json())
            .then(data => {
                console.log('Loaded HRRR Alaska data:');
                console.log('  Method:', data._metadata.method);
                console.log('  Variable:', data._metadata.variable);
                console.log('  Longitude span:', data._metadata.longitude_span);
                console.log();

                // Get continuous bounds
                var bounds = data.continuous.bounds;
                var west = bounds[0];
                var south = bounds[1];
                var east = bounds[2];
                var north = bounds[3];

                console.log('Continuous bounds (Russia → Alaska):');
                console.log('  West:', west.toFixed(2), '°');
                console.log('  South:', south.toFixed(2), '°');
                console.log('  East:', east.toFixed(2), '°');
                console.log('  North:', north.toFixed(2), '°');
                console.log('  Span:', (east - west).toFixed(1), '° (NO world-wrapping!)');
                console.log();

                // Add image overlay with continuous bounds
                var imageBounds = [
                    [south, west],
                    [north, east]
                ];

                var imageOverlay = L.imageOverlay(
                    data.continuous.image_url,
                    imageBounds,
                    {
                        opacity: 0.7,
                        interactive: false
                    }
                ).addTo(map);

                console.log('✓ Image overlay added');
                console.log();

                // Add boundary polygon
                var boundaryCoords = data.boundary_polygon.map(p => [p.lat, p.lon]);

                L.polygon(boundaryCoords, {
                    color: 'red',
                    weight: 2,
                    fillOpacity: 0,
                    interactive: false
                }).addTo(map);

                console.log('✓ Boundary polygon added (' + boundaryCoords.length + ' points)');
                console.log();

                // Get boundary extent
                var lats = data.boundary_polygon.map(p => p.lat);
                var lons = data.boundary_polygon.map(p => p.lon);

                console.log('Boundary extent:');
                console.log('  Latitude:', Math.min(...lats).toFixed(2), '° to', Math.max(...lats).toFixed(2), '°');
                console.log('  Longitude:', Math.min(...lons).toFixed(2), '° to', Math.max(...lons).toFixed(2), '°');
                console.log('  Span:', (Math.max(...lons) - Math.min(...lons)).toFixed(1), '°');
                console.log();

                // Check alignment
                var lonDiff = Math.abs(Math.min(...lons) - west) + Math.abs(Math.max(...lons) - east);
                var latDiff = Math.abs(Math.min(...lats) - south) + Math.abs(Math.max(...lats) - north);
                var totalDiff = lonDiff + latDiff;

                console.log('Alignment check:', totalDiff.toFixed(2), '° difference');
                if (totalDiff < 1) {
                    console.log('✓ EXCELLENT alignment!');
                } else if (totalDiff < 5) {
                    console.log('✓ Good alignment');
                } else {
                    console.log('⚠ Alignment could be better');
                }
                console.log();

                // Update status
                document.getElementById('status').innerHTML =
                    '<span class="status">✓ Loaded</span><br>' +
                    'Variable: ' + data._metadata.variable + '<br>' +
                    'Date: ' + data._metadata.date.substring(0, 10) + '<br>' +
                    'Span: ' + data._metadata.longitude_span + '<br>' +
                    'Bounds: Russia → Alaska (continuous)';

                // Fit map to bounds
                map.fitBounds(imageBounds);

                console.log('='.repeat(80));
                console.log('SUCCESS!');
                console.log('HRRR Alaska with continuous bounds from Russia to Alaska');
                console.log('No world-wrapping - just ' + data._metadata.longitude_span + ' span!');
                console.log('='.repeat(80));

            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML =
                    '<span class="error">✗ Error loading data</span><br>' +
                    error.message;
            });
    </script>
</body>
</html>
