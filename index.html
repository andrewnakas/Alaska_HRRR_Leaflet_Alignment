<!DOCTYPE html>
<html>
<head>
    <title>HRRR Alaska - Full Domain</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 12px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .info-panel .status {
            color: #27ae60;
            font-weight: bold;
        }
        .info-panel .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>HRRR Alaska - Full Domain</h3>
        <div id="status">Loading...</div>
        <div style="margin-top: 10px; font-size: 11px; color: #666;">
            Includes all Alaska + Aleutians<br>
            Crosses International Date Line
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        console.log('='.repeat(80));
        console.log('HRRR Alaska - Full Domain (All Data + Aleutians)');
        console.log('='.repeat(80));
        console.log();

        // Create map
        var map = L.map('map', {
            center: [60, -155],
            zoom: 5,
            minZoom: 3,
            maxZoom: 10
        });

        // Add OpenStreetMap base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Load HRRR data
        fetch('test-data.json')
            .then(response => response.json())
            .then(data => {
                console.log('Loaded HRRR Alaska data:');
                console.log('  Method:', data._metadata.method);
                console.log('  Variable:', data._metadata.variable);
                console.log('  Date:', data._metadata.date);
                console.log('  Grid:', data._metadata.grid_shape.join(' x '));
                console.log('  Longitude span:', data._metadata.longitude_span);
                console.log();

                // Get bounds
                var bounds = data.direct.bounds;
                var west = bounds[0];
                var south = bounds[1];
                var east = bounds[2];
                var north = bounds[3];

                console.log('Image bounds (cropped to Alaska):');
                console.log('  West:', west.toFixed(2), '°');
                console.log('  South:', south.toFixed(2), '°');
                console.log('  East:', east.toFixed(2), '°');
                console.log('  North:', north.toFixed(2), '°');
                console.log('  Longitude span:', (east - west).toFixed(1), '° (NOT 360°!)');
                console.log();

                // Add image overlay
                var imageBounds = [
                    [south, west],  // Southwest
                    [north, east]   // Northeast
                ];

                var imageOverlay = L.imageOverlay(
                    data.direct.image_url,
                    imageBounds,
                    {
                        opacity: 0.7,
                        interactive: false
                    }
                ).addTo(map);

                console.log('✓ Image overlay added');
                console.log();

                // Add boundary polygon
                var boundaryCoords = data.boundary_polygon.map(p => [p.lat, p.lon]);

                var boundaryPolygon = L.polygon(boundaryCoords, {
                    color: 'red',
                    weight: 2,
                    fillOpacity: 0,
                    interactive: false
                }).addTo(map);

                console.log('✓ Boundary polygon added');
                console.log('  Points:', data.boundary_polygon.length);
                console.log();

                // Verify alignment
                var lats = data.boundary_polygon.map(p => p.lat);
                var lons = data.boundary_polygon.map(p => p.lon);
                var boundary_west = Math.min(...lons);
                var boundary_south = Math.min(...lats);
                var boundary_east = Math.max(...lons);
                var boundary_north = Math.max(...lats);

                console.log('Boundary extent:');
                console.log('  West:', boundary_west.toFixed(6), '°');
                console.log('  South:', boundary_south.toFixed(6), '°');
                console.log('  East:', boundary_east.toFixed(6), '°');
                console.log('  North:', boundary_north.toFixed(6), '°');
                console.log();

                var diff = Math.abs(boundary_west - west) +
                          Math.abs(boundary_south - south) +
                          Math.abs(boundary_east - east) +
                          Math.abs(boundary_north - north);

                console.log('Alignment check:', diff.toFixed(6), '° difference');
                if (diff < 0.001) {
                    console.log('✓ PERFECT ALIGNMENT!');
                } else if (diff < 0.01) {
                    console.log('✓ Good alignment');
                } else {
                    console.log('⚠ Alignment could be better');
                }
                console.log();

                // Update status
                document.getElementById('status').innerHTML =
                    '<span class="status">✓ Loaded</span><br>' +
                    'Variable: ' + data._metadata.variable + '<br>' +
                    'Date: ' + data._metadata.date.substring(0, 10) + '<br>' +
                    'Grid: ' + data._metadata.grid_shape.join(' × ') + '<br>' +
                    'Span: ' + data._metadata.longitude_span + ' (dateline crossing)';

                console.log('='.repeat(80));
                console.log('SUCCESS!');
                console.log('Full HRRR Alaska domain - includes all data + Aleutians');
                console.log('='.repeat(80));

                // Fit map to data
                map.fitBounds(imageBounds);

            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML =
                    '<span class="error">✗ Error loading data</span><br>' +
                    error.message;
            });
    </script>
</body>
</html>
