<!DOCTYPE html>
<html>
<head>
    <title>HRRR Alaska - Proper Alignment</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 12px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .info-panel .status {
            color: #27ae60;
            font-weight: bold;
        }
        .info-panel .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>HRRR Alaska</h3>
        <div id="status">Loading...</div>
        <div style="margin-top: 10px; font-size: 11px; color: #666;">
            Properly reprojected & aligned<br>
            Split at dateline
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        console.log('='.repeat(80));
        console.log('HRRR Alaska - Proper Alignment');
        console.log('='.repeat(80));
        console.log();

        // Create map
        var map = L.map('map', {
            center: [60, -155],
            zoom: 4,
            minZoom: 3,
            maxZoom: 10
        });

        // Add OpenStreetMap base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        // Load HRRR data
        fetch('test-data.json')
            .then(response => response.json())
            .then(data => {
                console.log('Loaded HRRR Alaska data:');
                console.log('  Method:', data._metadata.method);
                console.log('  Variable:', data._metadata.variable);
                console.log('  Date:', data._metadata.date);
                console.log('  Regions:', data._metadata.split_regions);
                console.log();

                // Add western region (Alaska mainland)
                if (data.western) {
                    var westernBounds = data.western.bounds;
                    console.log('Western region (' + data.western.label + '):');
                    console.log('  Bounds:', westernBounds);

                    var westernImageBounds = [
                        [westernBounds[1], westernBounds[0]],  // Southwest
                        [westernBounds[3], westernBounds[2]]   // Northeast
                    ];

                    L.imageOverlay(
                        data.western.image_url,
                        westernImageBounds,
                        {
                            opacity: 0.7,
                            interactive: false
                        }
                    ).addTo(map);

                    console.log('  ✓ Western image added');
                }

                // Add eastern region (Aleutians)
                if (data.eastern) {
                    var easternBounds = data.eastern.bounds;
                    console.log('Eastern region (' + data.eastern.label + '):');
                    console.log('  Bounds:', easternBounds);

                    var easternImageBounds = [
                        [easternBounds[1], easternBounds[0]],  // Southwest
                        [easternBounds[3], easternBounds[2]]   // Northeast
                    ];

                    L.imageOverlay(
                        data.eastern.image_url,
                        easternImageBounds,
                        {
                            opacity: 0.7,
                            interactive: false
                        }
                    ).addTo(map);

                    console.log('  ✓ Eastern image added');
                }

                console.log();

                // Add boundary polygon
                var boundaryCoords = data.boundary_polygon.map(p => [p.lat, p.lon]);

                L.polygon(boundaryCoords, {
                    color: 'red',
                    weight: 2,
                    fillOpacity: 0,
                    interactive: false
                }).addTo(map);

                console.log('✓ Boundary polygon added (' + boundaryCoords.length + ' points)');
                console.log();

                // Calculate alignment check
                var lats = data.boundary_polygon.map(p => p.lat);
                var lons = data.boundary_polygon.map(p => p.lon);

                // Separate western and eastern hemispheres
                var westLons = lons.filter(lon => lon < 0);
                var eastLons = lons.filter(lon => lon > 0);

                console.log('Boundary extent:');
                console.log('  Latitude: ' + Math.min(...lats).toFixed(2) + '° to ' + Math.max(...lats).toFixed(2) + '°');
                console.log('  Western hemisphere: ' + Math.min(...westLons).toFixed(2) + '° to ' + Math.max(...westLons).toFixed(2) + '°');
                console.log('  Eastern hemisphere: ' + Math.min(...eastLons).toFixed(2) + '° to ' + Math.max(...eastLons).toFixed(2) + '°');
                console.log();

                // Check alignment for western region
                if (data.western) {
                    var westBounds = data.western.bounds;
                    var westBoundaryLons = westLons.filter(lon => lon >= westBounds[0] && lon <= westBounds[2]);
                    if (westBoundaryLons.length > 0) {
                        var westDiff = Math.abs(Math.min(...westBoundaryLons) - westBounds[0]) +
                                      Math.abs(Math.max(...westBoundaryLons) - westBounds[2]);
                        console.log('Western region alignment: ' + westDiff.toFixed(2) + '° difference');
                        if (westDiff < 1) {
                            console.log('  ✓ GOOD alignment');
                        }
                    }
                }

                // Check alignment for eastern region
                if (data.eastern) {
                    var eastBounds = data.eastern.bounds;
                    var eastBoundaryLons = eastLons.filter(lon => lon >= eastBounds[0] && lon <= eastBounds[2]);
                    if (eastBoundaryLons.length > 0) {
                        var eastDiff = Math.abs(Math.min(...eastBoundaryLons) - eastBounds[0]) +
                                      Math.abs(Math.max(...eastBoundaryLons) - eastBounds[2]);
                        console.log('Eastern region alignment: ' + eastDiff.toFixed(2) + '° difference');
                        if (eastDiff < 1) {
                            console.log('  ✓ GOOD alignment');
                        }
                    }
                }

                console.log();

                // Update status
                document.getElementById('status').innerHTML =
                    '<span class="status">✓ Loaded</span><br>' +
                    'Variable: ' + data._metadata.variable + '<br>' +
                    'Date: ' + data._metadata.date.substring(0, 10) + '<br>' +
                    'Regions: ' + data._metadata.split_regions + ' (split at dateline)<br>' +
                    'Alignment: Properly reprojected';

                console.log('='.repeat(80));
                console.log('SUCCESS!');
                console.log('HRRR Alaska with proper alignment - split at dateline');
                console.log('='.repeat(80));

            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML =
                    '<span class="error">✗ Error loading data</span><br>' +
                    error.message;
            });
    </script>
</body>
</html>
