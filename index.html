<!DOCTYPE html>
<html>
<head>
    <title>HRRR Alaska - Correct Polar Stereographic</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }
        .info-panel {
            position: absolute;
            top: 10px;
            right: 10px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
            max-width: 300px;
            font-size: 12px;
        }
        .info-panel h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
        .info-panel .status {
            color: #27ae60;
            font-weight: bold;
        }
        .info-panel .error {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="info-panel">
        <h3>HRRR Alaska - Polar Stereo</h3>
        <div id="status">Loading...</div>
        <div style="margin-top: 10px; font-size: 11px; color: #666;">
            Native polar stereographic<br>
            No distortion, proper dateline handling
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
    <script src="https://unpkg.com/proj4leaflet@1.0.2/src/proj4leaflet.js"></script>

    <script>
        console.log('='.repeat(80));
        console.log('HRRR Alaska - Polar Stereographic Projection');
        console.log('='.repeat(80));
        console.log();

        // Load native projection data
        fetch('test-data-native.json')
            .then(response => response.json())
            .then(data => {
                console.log('Loaded HRRR Alaska data:');
                console.log('  Method:', data._metadata.method);
                console.log('  Variable:', data._metadata.variable);
                console.log('  Grid:', data._metadata.grid_shape.join(' x '));
                console.log();

                // Define HRRR Alaska polar stereographic projection
                var projDef = data.native.crs;
                console.log('Projection:', projDef);
                console.log();

                proj4.defs('HRRR-AK', projDef);

                // Get native bounds in meters
                var bounds = data.native.bounds;
                var x_ll = bounds[0];
                var y_ll = bounds[1];
                var x_ur = bounds[2];
                var y_ur = bounds[3];

                console.log('Native bounds (meters):');
                console.log('  X:', x_ll.toFixed(0), 'to', x_ur.toFixed(0));
                console.log('  Y:', y_ll.toFixed(0), 'to', y_ur.toFixed(0));
                console.log();

                // Calculate scale factors for different zoom levels
                // HRRR Alaska grid is 3897km x 2757km
                var gridWidthMeters = x_ur - x_ll;
                var gridHeightMeters = y_ur - y_ll;

                // Target: fit in ~1000 pixels at zoom 0
                var pixelsAtZoom0 = 1000;
                var metersPerPixelZoom0 = gridWidthMeters / pixelsAtZoom0;

                // Create resolution array (each zoom level doubles resolution)
                var resolutions = [];
                for (var i = 0; i < 12; i++) {
                    resolutions.push(metersPerPixelZoom0 / Math.pow(2, i));
                }

                console.log('Resolution at zoom 0:', resolutions[0].toFixed(1), 'm/pixel');
                console.log();

                // Define CRS for Leaflet
                var hrrrCrs = new L.Proj.CRS('HRRR-AK', projDef, {
                    origin: [x_ll, y_ur],  // Top-left corner
                    resolutions: resolutions,
                    bounds: L.bounds([x_ll, y_ll], [x_ur, y_ur])
                });

                // Create map with native CRS
                var map = L.map('map', {
                    crs: hrrrCrs,
                    center: [0, 0],  // Will be adjusted
                    zoom: 0,
                    minZoom: 0,
                    maxZoom: 11,
                    maxBounds: [[y_ll, x_ll], [y_ur, x_ur]],
                    maxBoundsViscosity: 1.0
                });

                console.log('Map initialized with polar stereographic CRS');
                console.log();

                // Add HRRR image overlay with native bounds (in projection coordinates)
                var imageUrl = data.native.image_url;
                var imageBounds = [[y_ll, x_ll], [y_ur, x_ur]];

                var imageOverlay = L.imageOverlay(
                    imageUrl,
                    imageBounds,
                    {
                        opacity: 0.8,
                        interactive: false
                    }
                ).addTo(map);

                console.log('✓ Image overlay added');
                console.log('  URL:', imageUrl);
                console.log('  Bounds (meters):', imageBounds);
                console.log();

                // Add boundary polygon (convert lat/lon to projection coordinates)
                var boundaryCoords = data.boundary_polygon.map(function(p) {
                    // Convert WGS84 to projection coordinates
                    var projected = proj4('WGS84', 'HRRR-AK', [p.lon, p.lat]);
                    return [projected[1], projected[0]]; // [y, x] for Leaflet
                });

                var boundaryPolygon = L.polygon(boundaryCoords, {
                    color: 'red',
                    weight: 2,
                    fillOpacity: 0,
                    interactive: false
                }).addTo(map);

                console.log('✓ Boundary polygon added');
                console.log('  Points:', boundaryCoords.length);
                console.log();

                // Fit map to bounds
                map.fitBounds(imageBounds);

                // Update status
                document.getElementById('status').innerHTML =
                    '<span class="status">✓ Loaded</span><br>' +
                    'Variable: ' + data._metadata.variable + '<br>' +
                    'Date: ' + data._metadata.date.substring(0, 10) + '<br>' +
                    'Grid: ' + data._metadata.grid_shape.join(' × ') + '<br>' +
                    'Projection: Native polar stereographic';

                console.log('='.repeat(80));
                console.log('SUCCESS!');
                console.log('HRRR Alaska displayed in native polar stereographic projection');
                console.log('Proper dateline handling - no world-spanning');
                console.log('='.repeat(80));

            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('status').innerHTML =
                    '<span class="error">✗ Error loading data</span><br>' +
                    error.message;
            });
    </script>
</body>
</html>
