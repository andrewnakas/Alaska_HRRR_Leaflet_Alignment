name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/leaflet-alaska-hrrr-map-011CUxxbXdkWTRYv65FX9m4a
      - main

  # Allow manual trigger
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Fetch latest HRRR data
        run: |
          echo "Fetching latest HRRR data from production API..."
          curl -s "https://get-hrrr-forecast-pxvei6zf7a-uc.a.run.app" | \
            python3 -c "import sys, json; d=json.load(sys.stdin); print(json.dumps(d['data']['forecast_times'][0]['alaska'], indent=2))" \
            > test-data.json

          echo "Verifying data..."
          python3 -c "import json; d=json.load(open('test-data.json')); print(f'✓ Loaded {len(d.get(\"boundary_polygon\", []))} boundary points')"
        continue-on-error: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
